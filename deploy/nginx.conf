# Mẫu Nginx (thay cho Caddy): TLS do bạn cấu hình (certbot...), WebSocket qua wss, nén.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Không ghi query string vào log (token WebSocket nằm trong query).
log_format dilam '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 443 ssl http2;
  server_name dilam.example.com;
  # ssl_certificate     /etc/letsencrypt/live/dilam.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/dilam.example.com/privkey.pem;

  access_log /var/log/nginx/dilam.access.log dilam;
  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

server {
  listen 80;
  server_name dilam.example.com;
  return 301 https://$host$request_uri;
}
